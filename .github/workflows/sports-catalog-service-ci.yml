name: Sports Catalog Service CI

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'services/sports-catalog-service/**'
      - '.github/workflows/sports-catalog-service-ci.yml'

  push:
    branches:
      - develop
    paths:
      - 'services/sports-catalog-service/**'
      - '.github/workflows/sports-catalog-service-ci.yml'

jobs:
  test:
    name: Build and test sports-catalog-service
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/sports-catalog-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/sports-catalog-service/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Run verification
        run: ./mvnw clean verify
